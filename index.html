<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顔でお絵かき</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 100vw; height: 100vh; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
#app {
  position: relative;
  width: 100vw; height: 100vh;
}
#bg {
  position: absolute; inset: 0;
  background: url('img/bg_img.png') center/cover no-repeat;
  z-index: 0;
}
#canvas-frame {
  position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 92%; max-width: 960px;
  z-index: 2;
  pointer-events: none;
}
#canvas-frame img { width: 100%; display: block; }
#draw-canvas {
  position: absolute;
  z-index: 3;
  cursor: none;
}
#video-container {
  position: absolute;
  top: 16px; right: 16px;
  width: 200px; height: 150px;
  z-index: 10;
  border-radius: 12px;
  overflow: hidden;
  border: 3px solid rgba(255,255,255,0.5);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
#video {
  width: 100%; height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}
#overlay-canvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  transform: scaleX(-1);
}

#toast {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  z-index: 20;
  width: 300px;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: none;
}
#toast.show { transform: translate(-50%, -50%) scale(1); }
#toast img { width: 100%; }
#status {
  position: absolute;
  bottom: 10px; left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.85);
  font-size: 13px;
  z-index: 20;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  background: rgba(0,0,0,0.35);
  padding: 4px 14px;
  border-radius: 20px;
  white-space: nowrap;
}
#start-screen {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 30;
  color: white;
  gap: 20px;
}
#start-screen h1 { font-size: 2.4rem; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
#start-screen p { font-size: 1rem; opacity: 0.85; text-align: center; line-height: 2.0; }
#start-btn {
  padding: 16px 52px;
  font-size: 1.2rem;
  background: #e74c3c;
  color: white;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(231,76,60,0.6);
  transition: transform 0.2s, box-shadow 0.2s;
}
#start-btn:hover { transform: scale(1.06); box-shadow: 0 6px 30px rgba(231,76,60,0.8); }
#brush-indicator {
  position: absolute;
  pointer-events: none;
  z-index: 5;
  transition: left 0.25s cubic-bezier(0.34,1.56,0.64,1), top 0.25s cubic-bezier(0.34,1.56,0.64,1);
  transform: translate(-30%, -55%);
}
#nose-cursor {
  position: absolute;
  width: 28px; height: 28px;
  pointer-events: none;
  z-index: 15;
  transform: translate(-50%, -50%);
  display: none;
}
#nose-cursor img { width: 100%; height: 100%; }

</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <canvas id="draw-canvas"></canvas>
  <div id="canvas-frame">
    <img src="img/canvas.png" alt="canvas">
  </div>
  <div id="video-container">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay-canvas"></canvas>
  </div>
  <img id="brush-indicator" src="" alt="" style="position:absolute;pointer-events:none;z-index:6;width:44px;height:44px;transition:left 0.25s cubic-bezier(0.34,1.56,0.64,1),top 0.25s cubic-bezier(0.34,1.56,0.64,1);transform:translate(-20%,-50%);">
  <div id="nose-cursor">
    <img src="img/brush.png" alt="">
  </div>
  <div id="toast">
    <img src="img/saved_toast.png" alt="保存しました">
  </div>
  <div id="status">カメラを起動してください</div>
  <div id="start-screen">
    <h1>🎨 顔でお絵かき</h1>
    <p>
      👃 鼻を動かして線を描こう！<br>
      😉 右ウインク → 色を変える（次へ）<br>
      😜 左ウインク → 色を変える（前へ）<br>
      😮 口を「あ！」と開ける → キャンバス消去<br>
      😑 両目を2秒閉じる → 画像を保存
    </p>
    <button id="start-btn">📷 カメラを起動する</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

<script>
const BLINK_THRESH = 0.10;
const WINK_DURATION = 0.10;
const SAVE_DURATION = 2.0;
const MOUTH_OPEN_THRESH = 0.15;
const BRUSH_SIZE = 8;
const SMOOTHING = 0.80;

const COLORS = ['#000000', '#e74c3c', '#2980b9', '#27ae60', '#f1c40f', '#ffffff'];
const COLOR_NAMES = ['黒', '赤', '青', '緑', '黄', '白'];
let colorIndex = 0;

let leftCloseStart = null, rightCloseStart = null, bothCloseStart = null;
let leftSent = false, rightSent = false, bothSent = false, mouthSent = false;
let smoothX = null, smoothY = null;
let prevDrawX = null, prevDrawY = null;

const video = document.getElementById('video');
const drawCanvas = document.getElementById('draw-canvas');
const ctx = drawCanvas.getContext('2d');
const overlayCanvas = document.getElementById('overlay-canvas');
const octx = overlayCanvas.getContext('2d');
const noseCursor = document.getElementById('nose-cursor');
const brushIndicator = document.getElementById('brush-indicator');
const toast = document.getElementById('toast');
const statusEl = document.getElementById('status');

// 筆画像をcheck.pngから設定（既にsrcはHTML側でbase64埋め込み済み）
// nose-cursorと同じ画像を使う
brushIndicator.src = 'img/check.png';

function resizeCanvas() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  drawCanvas.style.cssText = `position:absolute;left:0;top:0;width:${w}px;height:${h}px;z-index:3;`;
  drawCanvas.width = w;
  drawCanvas.height = h;
}
window.addEventListener('resize', () => { resizeCanvas(); updatePalette(); });

// canvas.png のパレット部分の各色ドットのX位置（画像幅に対する比率）
// 黒, 赤, 青, 緑, 黄, 白 の順で左から均等に並んでいる
// canvas-frame画像のパレット行のY位置も比率で指定
const COLOR_X_RATIOS = [0.128, 0.257, 0.387, 0.516, 0.710, 0.862];
const PALETTE_Y_RATIO = 0.14; // パレット行の中央Y（canvas-frameの高さ比）

function updatePalette() {
  const frame = document.getElementById('canvas-frame');
  const r = frame.getBoundingClientRect();
  const x = r.left + r.width * COLOR_X_RATIOS[colorIndex];
  const y = r.top + r.height * PALETTE_Y_RATIO;
  brushIndicator.style.left = x + 'px';
  brushIndicator.style.top = y + 'px';
}

function changeColor(dir) {
  colorIndex = (colorIndex + dir + COLORS.length) % COLORS.length;
  updatePalette();
  statusEl.textContent = `色を変えました: ${COLOR_NAMES[colorIndex]}`;
}

function saveCanvas() {
  const link = document.createElement('a');
  const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0,19);
  link.download = `drawing-${ts}.png`;
  link.href = drawCanvas.toDataURL('image/png');
  link.click();
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

function clearCanvas() {
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
  prevDrawX = null; prevDrawY = null;
  drawCanvas.style.transition = 'opacity 0.15s';
  drawCanvas.style.opacity = '0.2';
  setTimeout(() => { drawCanvas.style.opacity = '1'; }, 200);
  statusEl.textContent = '消去しました！';
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function drawStroke(nx, ny) {
  const rect = drawCanvas.getBoundingClientRect();
  const lx = nx * window.innerWidth - rect.left;
  const ly = ny * window.innerHeight - rect.top;
  if (lx < 0 || lx > rect.width || ly < 0 || ly > rect.height) {
    prevDrawX = null; prevDrawY = null; return;
  }
  const px = (lx / rect.width) * drawCanvas.width;
  const py = (ly / rect.height) * drawCanvas.height;
  ctx.strokeStyle = COLORS[colorIndex];
  ctx.lineWidth = BRUSH_SIZE;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (prevDrawX !== null) {
    ctx.beginPath();
    ctx.moveTo(prevDrawX, prevDrawY);
    ctx.lineTo(px, py);
    ctx.stroke();
  }
  prevDrawX = px; prevDrawY = py;
}

function onResults(results) {
  octx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  if (!results.multiFaceLandmarks || !results.multiFaceLandmarks.length) {
    noseCursor.style.display = 'none';
    statusEl.textContent = '顔を検出できません...';
    prevDrawX = null; prevDrawY = null; return;
  }
  const lm = results.multiFaceLandmarks[0];
  const now = performance.now() / 1000;
  const nose = lm[1];
  if (smoothX === null) { smoothX = 1 - nose.x; smoothY = nose.y; }
  smoothX = smoothX * SMOOTHING + (1 - nose.x) * (1 - SMOOTHING);
  smoothY = smoothY * SMOOTHING + nose.y * (1 - SMOOTHING);
  noseCursor.style.display = 'none'; // 常に非表示
  drawStroke(smoothX, smoothY);

  const leftRatio = dist(lm[159], lm[145]) / dist(lm[133], lm[33]);
  const rightRatio = dist(lm[386], lm[374]) / dist(lm[362], lm[263]);
  const mouthRatio = dist(lm[13], lm[14]) / dist(lm[10], lm[152]);
  const isLeftClosed = leftRatio < BLINK_THRESH;
  const isRightClosed = rightRatio < BLINK_THRESH;
  const isMouthOpen = mouthRatio > MOUTH_OPEN_THRESH;

  // ミニオーバーレイ
  const vw = overlayCanvas.width, vh = overlayCanvas.height;
  [[lm[159], lm[145], isLeftClosed], [lm[386], lm[374], isRightClosed]].forEach(([top, btm, closed]) => {
    octx.strokeStyle = closed ? '#ff4444' : '#44ff44';
    octx.lineWidth = 2;
    octx.beginPath();
    octx.moveTo(top.x * vw, top.y * vh);
    octx.lineTo(btm.x * vw, btm.y * vh);
    octx.stroke();
  });
  octx.strokeStyle = isMouthOpen ? '#ff4444' : '#aaaaaa';
  octx.lineWidth = 2;
  octx.beginPath();
  octx.moveTo(lm[13].x * vw, lm[13].y * vh);
  octx.lineTo(lm[14].x * vw, lm[14].y * vh);
  octx.stroke();
  octx.fillStyle = '#ffee00';
  octx.beginPath();
  octx.arc(nose.x * vw, nose.y * vh, 4, 0, Math.PI*2);
  octx.fill();

  // 両目閉じ → 保存
  if (isLeftClosed && isRightClosed) {
    if (bothCloseStart === null) bothCloseStart = now;
    const elapsed = now - bothCloseStart;
    if (elapsed > SAVE_DURATION && !bothSent) { saveCanvas(); bothSent = true; }
    statusEl.textContent = `保存まで ${Math.max(0, SAVE_DURATION - elapsed).toFixed(1)}秒...`;
  } else { bothCloseStart = null; bothSent = false; }

  // 左ウインク
  if (isLeftClosed && !isRightClosed) {
    if (leftCloseStart === null) leftCloseStart = now;
    if ((now - leftCloseStart > WINK_DURATION) && !leftSent) { changeColor(1); leftSent = true; }
  } else { leftCloseStart = null; leftSent = false; }

  // 右ウインク
  if (isRightClosed && !isLeftClosed) {
    if (rightCloseStart === null) rightCloseStart = now;
    if ((now - rightCloseStart > WINK_DURATION) && !rightSent) { changeColor(-1); rightSent = true; }
  } else { rightCloseStart = null; rightSent = false; }

  // 口開け
  if (isMouthOpen) {
    if (!mouthSent) { clearCanvas(); mouthSent = true; }
  } else { mouthSent = false; }

  if (!isMouthOpen && !(isLeftClosed && isRightClosed)) {
    statusEl.textContent = `描画中 ✏️ 色: ${COLOR_NAMES[colorIndex]}`;
  }
}

async function startCamera() {
  document.getElementById('start-screen').style.display = 'none';
  statusEl.textContent = 'カメラを起動中...';
  const faceMesh = new FaceMesh({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
  faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.7, minTrackingConfidence:0.7 });
  faceMesh.onResults(onResults);
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width:640, height:480, facingMode:'user' } });
  video.srcObject = stream;
  video.onloadedmetadata = () => {
    overlayCanvas.width = video.videoWidth;
    overlayCanvas.height = video.videoHeight;
    const cam = new Camera(video, {
      onFrame: async () => { await faceMesh.send({ image: video }); },
      width: 640, height: 480
    });
    cam.start();
    statusEl.textContent = '準備完了！鼻を動かして描いてください 👃';
  };
}

document.getElementById('start-btn').addEventListener('click', startCamera);
updatePalette();
resizeCanvas();
</script>
</body>
</html>
